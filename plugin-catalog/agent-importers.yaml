description: '`hermes import-agent`: import an OpenClaw (~/.openclaw), Claude Code (~/.claude), Codex CLI
  (~/.codex) or Cursor (~/.cursor) setup into Hermes in one command.
  Instructions, rules and memories become memory entries, permission rules become command allow/deny
  lists, MCP servers land in config.yaml and skills are copied; always previews first, and `--sync`
  re-imports sources that changed. OpenClaw migration (formerly `hermes claw migrate`, a spelling the
  plugin keeps, plus `hermes claw cleanup`) also maps model, messaging and workspace settings and ships
  the openclaw-migration skill. Formerly built into Hermes core; profiles with a registered sync source
  are migrated automatically. Disclosure — no Python dependencies, no network calls and no model calls:
  it reads those agents'' local config trees and writes only into the active profile (SOUL.md,
  memories/ with a backup, config.yaml, skills/, import-sync.json; for OpenClaw also a pre-migration zip
  in backups/ and a report under migration/openclaw/). Credentials are never imported, except that
  OpenClaw''s allowlisted keys and bot tokens are copied into the profile''s .env when the user passes
  --migrate-secrets. To warn about a still-running OpenClaw it runs local process probes (pgrep and
  systemctl --user; tasklist and PowerShell on Windows), and `hermes claw cleanup` renames leftover
  OpenClaw directories after confirmation.'
